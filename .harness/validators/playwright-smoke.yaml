# Browser smoke test.
#
# Every expectation here must hold whatever the market is doing. An earlier version looked
# for "Bids" and "Asks" on the market page, which passed until testnet book 3 halted and
# emptied — after which a correctly-rendered empty book would have failed the gate. A smoke
# test that depends on someone else's liquidity tests the venue, not the template.
#
# Two things read this file, and they check different things:
#
#   - `npx hedera-harness validate` (Tier 2) loads every route and fails on an HTTP error,
#     a page that renders no real content, a browser console error, or forbidden text.
#     It does not read `expect`.
#   - `yarn smoke` checks `expect.visibleText` on top of that, so the assertions below are
#     actually enforced rather than decorative.
#
# The server is the production build, not `next:dev`. A dev server compiles each route on
# its first request — the home page alone takes about 50 seconds on a modest machine —
# which outlasts the gate's 30-second page load, so the gate would be timing a compiler
# rather than testing the app.
#
# It serves the build that the `yarn next:build` command step has just produced, which
# runs before this gate, so the browser tests exactly the build that was verified. It
# does not build again here: the harness allows 30 seconds for the server to print its
# URL, and a build takes longer than that. Run on its own, build first.
server:
  command: yarn workspace @sh/nextjs serve
  url: http://localhost:3000
  timeoutMs: 120000
defaults:
  failOnConsoleError: true
routes:
  - name: home
    path: /
    expect:
      visibleText: ["limit-orders", "SaucerSwap"]
  - name: markets
    path: /markets
    expect:
      # The table and its headers render whether or not any market is tradeable.
      visibleText: ["Markets", "State", "Min notional", "24h volume"]
  - name: market
    path: /market/3
    expect:
      # Market rules come from /books, so they are present even when the book is empty.
      # Section headings are uppercased by CSS and innerText returns the transformed text,
      # so these deliberately match label text that is not transformed.
      visibleText: ["Tick size", "Min notional", "Lot size", "Maker fee"]
  - name: market-missing
    path: /market/999999
    expect:
      visibleText: ["Market not found"]
  - name: journal
    path: /journal
    expect:
      visibleText: ["Order intent journal"]
  - name: orders
    path: /orders
    expect:
      visibleText: ["Your orders"]
forbidden:
  visibleText: ["Application error", "Unhandled Runtime Error", "NaN", "Infinity", "500 Internal"]
